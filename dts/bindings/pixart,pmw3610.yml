description: |
  Sensor driver for the pixart PMW3610 mouse sensor 

compatible: "pixart,pmw3610"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  cpi:
    type: int
    default: 600
    description: "CPI value (Range: 200 - 3200, Step: 200)"
  motion-threshold:
    type: int
    default: 1
    description: |
      Ignore X/Y motion deltas whose absolute values are both at or below this
      threshold. Set to 0 to disable drift filtering.
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  evt-type:
    type: int
    required: true
  x-input-code:
    type: int
    required: true
  y-input-code:
    type: int
    required: true
  force-awake:
    type: boolean
  force-awake-4ms-mode:
    type: boolean
  inertial-scroll:
    type: boolean
    description: "Enable inertial scrolling when this sensor is configured as a scroll device."
  inertial-scroll-decay-pct:
    type: int
    default: 99
    description: "Velocity decay percentage applied on each inertial tick."
  inertial-scroll-interval-ms:
    type: int
    default: 10
    description: "Interval in milliseconds for synthetic inertial scroll reports."
  inertial-scroll-threshold:
    type: int
    default: 4
    description: "Minimum fixed-point velocity threshold before inertial scrolling stops."
  inertial-scroll-gain-pct:
    type: int
    default: 130
    description: "Gain percentage used to derive inertial velocity from the latest physical scroll delta."
  inertial-scroll-layers:
    type: array
    description: "List of active ZMK layer numbers where inertial scrolling is allowed. Omit this property to allow all layers."
  vertical-scroll-uses-x-axis:
    type: boolean
    description: "Treat the sensor X axis as vertical scroll for direction toggling. Use for sensors mounted with a 90-degree rotation."
