description: |
  Sensor driver for the pixart PMW3610 mouse sensor 

compatible: "pixart,pmw3610"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  cpi:
    type: int
    default: 600
    description: "CPI value (Range: 200 - 3200, Step: 200)"
  motion-threshold:
    type: int
    default: 1
    description: |
      Ignore X/Y motion deltas whose absolute values are both at or below this
      threshold. Set to 0 to disable drift filtering.
  max-motion-delta:
    type: int
    default: 512
    description: |
      Reject a single motion sample when either axis reaches this absolute
      value. This prevents corrupted-but-successful SPI samples from producing
      a pointer jump or seeding inertial scrolling.
  max-report-delta:
    type: int
    default: 2047
    description: |
      Maximum absolute X/Y delta emitted in one input report after samples
      have been accumulated. Excess motion is discarded instead of being
      released in later reports as a delayed cursor or scroll jump.
  low-speed-stabilizer:
    type: boolean
    description: |
      Stabilize low-speed pointer motion without discarding distance. Repeated
      same-direction micro motion is emitted, while isolated direction
      reversals are held for confirmation and cancelled when they bounce back.
  low-speed-stabilizer-threshold:
    type: int
    default: 1
    description: "Largest absolute delta treated as micro motion."
  low-speed-stabilizer-timeout-ms:
    type: int
    default: 30
    description: "Idle time after which micro-motion direction history is reset."
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  evt-type:
    type: int
    required: true
  x-input-code:
    type: int
    required: true
  y-input-code:
    type: int
    required: true
  force-awake:
    type: boolean
  force-awake-4ms-mode:
    type: boolean
  inertial-scroll:
    type: boolean
    description: "Enable inertial scrolling when this sensor is configured as a scroll device."
  scroll-direction-toggle:
    type: boolean
    description: "Allow the scroll direction toggle behaviors to affect this sensor even when inertial-scroll is disabled."
  inertial-scroll-decay-pct:
    type: int
    default: 99
    description: "Velocity decay percentage applied on each inertial tick."
  inertial-scroll-decay-basis-points:
    type: int
    default: 0
    description: "Optional velocity retention in 0.01 percent units; zero uses inertial-scroll-decay-pct."
  inertial-scroll-interval-ms:
    type: int
    default: 10
    description: "Interval in milliseconds for synthetic inertial scroll reports."
  inertial-scroll-threshold:
    type: int
    default: 4
    description: "Minimum fixed-point velocity threshold before inertial scrolling stops."
  inertial-scroll-gain-pct:
    type: int
    default: 130
    description: "Gain percentage used to derive inertial velocity from the latest physical scroll delta."
  inertial-scroll-max-velocity:
    type: int
    default: 32
    description: "Maximum inertial output velocity in whole scroll steps per tick."
  inertial-scroll-max-duration-ms:
    type: int
    default: 1800
    description: "Maximum duration in milliseconds of one inertial tail."
  inertial-scroll-fade-duration-ms:
    type: int
    default: 250
    description: "Duration of the linear fade applied before the inertial maximum duration is reached."
  inertial-scroll-layers:
    type: array
    description: "List of active ZMK layer numbers where inertial scrolling is allowed. Omit this property to allow all layers."
  vertical-scroll-uses-x-axis:
    type: boolean
    description: "Treat the sensor X axis as vertical and Y as horizontal for direction toggling. Use for sensors mounted with a 90-degree rotation."
